<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo-link"><h1>⚽ Предзаказ билетов</h1></a>
                <nav>
                    <a href="index.html">Матчи</a>
                    <a href="profile.html">Профиль</a>
                    <a href="login.html">Войти</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <h2 style="text-align: center; padding: 2rem 2rem 0;">Вход по Email</h2>
            
            <!-- Step 1: Email Input -->
            <form id="emailForm" class="auth-form">
                <p style="color: var(--text-light); margin-bottom: 1.5rem;">
                    Введите ваш email. Мы отправим вам код подтверждения.
                </p>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <div id="emailError" class="error-message"></div>
                <button type="submit" class="btn btn-primary btn-large">Получить код</button>
            </form>

            <!-- Step 2: Code Verification -->
            <form id="codeForm" class="auth-form" style="display: none;">
                <p style="color: var(--text-light); margin-bottom: 1rem;">
                    Код отправлен на <strong id="emailDisplay"></strong>
                </p>
                <div class="info-text" style="background: #FEF3C7; color: #92400E; margin-bottom: 1rem;">
                    💡 <strong>MOCKUP режим:</strong> Введите любой 6-значный код для входа
                </div>
                <div class="form-group">
                    <label for="verificationCode">Код подтверждения</label>
                    <input type="text" id="verificationCode" placeholder="000000" maxlength="6" required 
                           style="font-size: 1.5rem; text-align: center; letter-spacing: 0.5rem;">
                </div>
                <div id="nameSection" class="form-group" style="display: none;">
                    <label for="userName">Ваше имя</label>
                    <input type="text" id="userName" placeholder="Иван Иванов">
                    <span class="field-hint">Это новый аккаунт. Укажите ваше имя.</span>
                </div>
                <div id="codeError" class="error-message"></div>
                <button type="submit" class="btn btn-primary btn-large">Войти</button>
                <button type="button" id="resendCode" class="btn btn-secondary btn-large" style="margin-top: 1rem;">
                    Отправить код повторно
                </button>
                <button type="button" id="changeEmail" class="btn btn-secondary btn-large" style="margin-top: 0.5rem;">
                    Изменить email
                </button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Сервис предзаказа билетов на футбольные матчи</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
