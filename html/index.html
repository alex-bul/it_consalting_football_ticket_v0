<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предзаказ билетов на футбол</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>⚽ Предзаказ билетов</h1>
                <nav>
                    <a href="index.html">Матчи</a>
                    <a href="profile.html" id="profileLink">Профиль</a>
                    <a href="login.html" id="authLink">Войти</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Доступные матчи</h2>
            <p>Оформите предзаказ на билеты и получите лучшие места</p>
        </section>

        <div id="matchesContainer" class="matches-grid">
            <!-- Matches will be loaded here by JavaScript -->
        </div>

        <div id="noMatches" class="no-matches" style="display: none;">
            <p>На данный момент нет доступных матчей.</p>
            <p>Подпишитесь на уведомления, чтобы не пропустить старт продаж.</p>
            <button class="btn btn-secondary">Подписаться</button>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Сервис предзаказа билетов на футбольные матчи</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/matches.js"></script>
</body>
</html>
